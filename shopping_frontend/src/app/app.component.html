<div class="canvas">
  <div class="shell">
    <header class="topbar">
      <div class="brand" routerLink="/" aria-label="Go to homepage">
        <span class="dot" aria-hidden="true"></span>
        <span class="logo-text">YOUR LOGO</span>
      </div>

      <nav class="nav">
        <a class="nav-link is-active" routerLink="/">Home</a>
        <a class="nav-link" routerLink="/profile">Our Team</a>
        <a class="nav-link" routerLink="/orders">Services</a>
        <a class="nav-link" routerLink="/terms">Contact</a>
        <button class="cart-btn" routerLink="/cart" aria-label="Cart">
          🛒
          <span class="badge" *ngIf="cartCount$ | async as c">{{ c }}</span>
        </button>
      </nav>
    </header>

    <main class="hero">
      <section class="hero-left">
        <h1 class="hero-title">
          <span class="line-1">ONLINE</span>
          <span class="line-2">SHOPPING</span>
        </h1>
        <p class="hero-sub">
          Discover modern essentials and premium products crafted for your everyday. Shop the latest arrivals and best-sellers with seamless checkout.
        </p>
        <div class="hero-ctas">
          <button class="btn btn-primary" (click)="onSearch()">LEARN MORE</button>
          <button class="btn btn-secondary" (click)="clearFilters()">Browse All</button>
        </div>
      </section>

      <section class="hero-right">
        <img class="hero-illustration"
             src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?q=80&w=1200&auto=format&fit=crop"
             alt="Shopping app illustration with phone and storefront" />
      </section>
    </main>

    <section class="category-chips" *ngIf="categories$ | async as cats">
      <button class="chip is-active" (click)="filterBy('all')">All</button>
      <button class="chip" *ngFor="let cat of cats" (click)="filterBy(cat)">{{ cat }}</button>
    </section>

    <section class="filters-inline">
      <div class="search">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.471 6.471 0 0 0 1.57-4.23C15.99 6.01 12.98 3 9.5 3S3 6.01 3 9.5S6.01 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l4.25 4.25l1.5-1.5L15.5 14M9.5 14C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5S14 7.01 14 9.5S11.99 14 9.5 14"/></svg>
        <input type="text" [(ngModel)]="query" placeholder="Search products..." (keyup.enter)="onSearch()" />
        <button class="btn small" (click)="onSearch()">Search</button>
      </div>

      <div class="range-group">
        <label>Min $
          <input type="number" [(ngModel)]="minPrice" />
        </label>
        <label>Max $
          <input type="number" [(ngModel)]="maxPrice" />
        </label>
        <button class="btn small" (click)="applyFilters()">Apply</button>
        <button class="btn small ghost" (click)="clearFilters()">Clear</button>
      </div>
    </section>

    <section class="content">
      <router-outlet />
    </section>

    <footer class="footer">
      <div>© {{year}} Elegant Shop</div>
      <div class="links">
        <a routerLink="/privacy">Privacy</a>
        <a routerLink="/terms">Terms</a>
      </div>
    </footer>
  </div>
</div>
